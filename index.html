<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>一方院・旅宿｜古坑東和陳宅 歷史導覽</title>
<meta name="theme-color" content="#BA4B2F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  /* 品牌色票：600_Project/yifang-content/01_品牌識別.md v1.4 §九 */
  :root{
    --brick:#BA4B2F; --green:#26573C; --paper:#F7F3EC; --ink:#160604;
    --paper-2:#efe8db; --line:#d9cfbe;
    --serif:"Noto Serif TC",serif; --sans:"Noto Sans TC",system-ui,sans-serif;
    --body:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:var(--sans);color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased}
  .wrap{max-width:560px;margin:0 auto;background:var(--paper);min-height:100vh}
  .hidden{display:none !important}
  .serif{font-family:var(--serif)}

  header{padding:26px 22px 0;text-align:center}
  header img{height:246px;max-width:100%}
  header .rule{height:1px;background:var(--line);margin-top:18px}

  #home .hero{padding:28px 22px 4px;text-align:center}
  #home .hero h1{font-family:var(--serif);font-size:23px;font-weight:600;line-height:1.55}
  #home .hero #intro{margin-top:22px;color:#574b41;font-size:15.5px;text-align:center}
  #home .hero #intro p{margin-top:15px;line-height:1.95;text-wrap:balance}
  #home .hero #intro p:first-child{margin-top:0}
  @media (max-width:400px){ #home .hero #intro{font-size:14.5px} }


  .toc{padding:22px 22px 44px}
  .toc a{display:flex;align-items:center;gap:15px;text-decoration:none;color:var(--ink);background:var(--paper-2);padding:17px 18px;margin-bottom:11px}
  .toc .num{flex:0 0 38px;height:38px;border-radius:50%;background:var(--brick);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:16px;font-weight:600}
  .toc .tt{font-family:var(--serif);font-size:19px;font-weight:600}
  .toc .en2{font-size:10.5px;letter-spacing:.14em;color:var(--green);margin-top:3px}

  .band{background:var(--brick);color:#fff;padding:17px 22px 20px}
  .band .row{display:flex;align-items:center;justify-content:space-between}
  .band .row a{color:#fff;text-decoration:none;font-size:12.5px;opacity:.95}
  .band .row .en0{font-size:9px;letter-spacing:.26em;opacity:.85}
  .band h2{font-family:var(--serif);font-size:33px;font-weight:700;margin-top:12px;line-height:1.2}
  .band .en2{margin-top:7px;font-size:10px;letter-spacing:.22em;opacity:.9}

  .photo img{width:100%;display:block}
  .photo .ph{height:190px;background:var(--paper-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;color:#8a7d70;font-size:12.5px}
  .photo .ph .ic{font-size:26px}

  .player{background:var(--green);color:#fff;padding:0 0 13px}
  .player .main{height:62px;display:flex;align-items:center;gap:15px;padding:0 22px}
  .player .pl{width:0;height:0;border-left:18px solid #fff;border-top:11px solid transparent;border-bottom:11px solid transparent;flex:0 0 auto;cursor:pointer}
  .player .pause{width:16px;height:21px;flex:0 0 auto;cursor:pointer;position:relative}
  .player .pause::before,.player .pause::after{content:"";position:absolute;top:0;width:5px;height:21px;background:#fff}
  .player .pause::before{left:1px} .player .pause::after{right:1px}
  .player .l1{font-family:var(--serif);font-size:17.5px;font-weight:600;letter-spacing:.03em}
  .player .tm{margin-left:auto;font-size:13.5px;opacity:.92;letter-spacing:.06em;font-variant-numeric:tabular-nums}
  .player .bar{margin:0 22px;height:3px;background:rgba(255,255,255,.28);cursor:pointer}
  .player .bar i{display:block;height:100%;background:#fff;width:0}
  .player .skips{display:flex;gap:10px;padding:11px 22px 0}
  .player .skips button{flex:1;background:transparent;border:1px solid rgba(255,255,255,.45);color:#fff;padding:9px 0;font-family:var(--sans);font-size:13px;cursor:pointer}

  .fs{display:flex;align-items:center;gap:9px;padding:13px 22px;border-bottom:1px solid var(--line)}
  .fs .lb{font-size:12px;color:#8a7d70;letter-spacing:.06em;margin-right:auto}
  .fs button{font-family:var(--serif);font-size:14px;border:1px solid var(--line);background:transparent;color:var(--green);min-width:40px;height:32px;cursor:pointer}
  .fs button.on{background:var(--green);color:#fff;border-color:var(--green)}

  .story .sec{padding:24px 22px}
  .story .sec:nth-child(even){background:var(--paper-2)}
  .story h3{font-family:var(--serif);font-size:calc(var(--body) + 2px);font-weight:700;color:var(--brick);letter-spacing:.02em;line-height:1.4;margin-bottom:13px}
  .story p{font-size:var(--body);line-height:1.95;margin-bottom:16px;text-wrap:pretty}
  .story p:last-child{margin-bottom:0}

  .backall{margin:22px;background:var(--brick);color:#fff;height:54px;text-decoration:none;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:16.5px;font-weight:600;letter-spacing:.06em}
  footer{padding:8px 22px 34px;text-align:center;font-size:11px;color:#8a7d70;line-height:1.9}
</style>
</head>
<body>
<div class="wrap">

  <header id="brand">
    <img src="logo.svg" alt="一方院・旅宿 YI FANG STAY">
    <div class="rule"></div>
  </header>

  <section id="home" class="hidden">
    <div class="hero">
      <h1 class="serif" id="sub"></h1>
      <div id="intro"></div>
    </div>
    <nav class="toc" id="toc"></nav>
  </section>

  <section id="stop" class="hidden">
    <div class="band">
      <div class="row">
        <a href="#home">← 回導覽總覽</a>
        <div class="en0">YI FANG STAY</div>
      </div>
      <h2 id="s-tt"></h2>
      <div class="en2" id="s-en"></div>
    </div>

    <div class="photo" id="s-photo"></div>

    <div class="player">
      <div class="main">
        <div class="pl" id="s-toggle"></div>
        <div class="l1">語音導覽</div>
        <div class="tm"><span id="s-cur">0:00</span> / <span id="s-dur">--:--</span></div>
      </div>
      <div class="bar" id="s-bar"><i id="s-fill"></i></div>
      <div class="skips">
        <button type="button" id="s-back">← 倒回 10 秒</button>
        <button type="button" id="s-fwd">快轉 10 秒 →</button>
      </div>
      <audio id="s-audio" preload="metadata"></audio>
    </div>

    <div class="fs">
      <div class="lb">文字大小</div>
      <button type="button" data-fs="16">A−</button>
      <button type="button" data-fs="18">18</button>
      <button type="button" data-fs="21">A＋</button>
    </div>

    <div class="story" id="s-story"></div>

    <a class="backall" href="#home">回導覽總覽</a>
  </section>

  <footer>
    雲林縣歷史建築・日治大正 7 年（1918）<br>
    古坑鄉東和村文化路 115-1 號｜一方院・旅宿
  </footer>
</div>

<script>
const $ = s => document.querySelector(s);
let DATA = null;
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function setFS(px, save){
  document.documentElement.style.setProperty('--body', px + 'px');
  document.querySelectorAll('.fs button').forEach(b => b.classList.toggle('on', +b.dataset.fs === +px));
  if(save){ try{ localStorage.setItem('yf-fs', px); }catch(e){} }
}
let savedFS = 18;
try{ savedFS = +localStorage.getItem('yf-fs') || 18; }catch(e){}
document.querySelectorAll('.fs button').forEach(b => b.addEventListener('click', () => setFS(b.dataset.fs, true)));
setFS(savedFS, false);

(async function init(){
  try{
    const res = await fetch('stops.json', {cache:'no-store'});
    DATA = await res.json();
  }catch(e){
    $('#intro').innerHTML = '<p>內容載入失敗，請用網頁伺服器開啟。</p>';
    $('#home').classList.remove('hidden');
    return;
  }
  $('#sub').textContent = DATA.site.subtitle;
  $('#intro').innerHTML = DATA.site.intro.split(/\n\s*\n/)
    .map(b => '<p>' + esc(b.trim()).replace(/\n/g,'<br>') + '</p>').join('');
  $('#toc').innerHTML = DATA.stops.map(s =>
    '<a href="#' + s.id + '"><span class="num serif">' + s.id + '</span>' +
    '<span><span class="tt">' + esc(s.title) + '</span><br>' +
    '<span class="en2">' + esc(s.en) + '</span></span></a>').join('');
  route();
})();

window.addEventListener('hashchange', route);
function route(){
  const id = parseInt((location.hash || '').replace('#',''), 10);
  if(DATA && id >= 1 && id <= DATA.stops.length) renderStop(id);
  else showHome();
  window.scrollTo(0,0);
}
function showHome(){
  $('#s-audio').pause();
  $('#stop').classList.add('hidden');
  $('#home').classList.remove('hidden');
  $('#brand').classList.remove('hidden');   // 總覽才露出 logo
}

function renderStop(id){
  const s = DATA.stops.find(x => x.id === id);
  $('#home').classList.add('hidden');
  $('#brand').classList.add('hidden');      // 站頁不放 logo，磚紅標頭直接接到最上面
  $('#stop').classList.remove('hidden');
  $('#s-tt').textContent = s.title;
  $('#s-en').textContent = s.en;

  const secs = [];
  s.story.split(/\n\s*\n/).map(x => x.trim()).filter(Boolean).forEach(blk => {
    const h = blk.match(/^【(.+)】$/);
    if(h) secs.push({h: h[1], ps: []});
    else{
      if(!secs.length) secs.push({h: null, ps: []});
      secs[secs.length-1].ps.push(blk);
    }
  });
  $('#s-story').innerHTML = secs.map(sec =>
    '<div class="sec">' + (sec.h ? '<h3>' + esc(sec.h) + '</h3>' : '') +
    sec.ps.map(p => '<p>' + esc(p) + '</p>').join('') + '</div>').join('');

  const ph = $('#s-photo');
  ph.innerHTML = '<div class="ph"><span class="ic">🏚️</span>照片整理中</div>';
  const img = new Image();
  img.onload = () => { ph.innerHTML=''; ph.appendChild(img); };
  img.alt = s.title; img.src = 'img/' + s.img;

  const a = $('#s-audio');
  a.pause(); a.src = 'audio/' + s.audio; a.currentTime = 0;
  $('#s-cur').textContent = '0:00'; $('#s-dur').textContent = '--:--';
  $('#s-fill').style.width = '0';
  $('#s-toggle').className = 'pl';
}

const A = $('#s-audio');
const fmt = t => isFinite(t) ? Math.floor(t/60) + ':' + String(Math.floor(t%60)).padStart(2,'0') : '--:--';
$('#s-toggle').addEventListener('click', () => A.paused ? A.play() : A.pause());
A.addEventListener('play',  () => $('#s-toggle').className = 'pause');
A.addEventListener('pause', () => $('#s-toggle').className = 'pl');
A.addEventListener('ended', () => $('#s-toggle').className = 'pl');
A.addEventListener('loadedmetadata', () => $('#s-dur').textContent = fmt(A.duration));
A.addEventListener('timeupdate', () => {
  $('#s-cur').textContent = fmt(A.currentTime);
  if(A.duration) $('#s-fill').style.width = (A.currentTime / A.duration * 100) + '%';
});
$('#s-back').addEventListener('click', () => A.currentTime = Math.max(0, A.currentTime - 10));
$('#s-fwd').addEventListener('click',  () => A.currentTime = Math.min(A.duration || 0, A.currentTime + 10));
$('#s-bar').addEventListener('click', e => {
  if(!A.duration) return;
  const r = e.currentTarget.getBoundingClientRect();
  A.currentTime = (e.clientX - r.left) / r.width * A.duration;
});
</script>
</body>
</html>
